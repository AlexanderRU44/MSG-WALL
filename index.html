<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Msg Wall</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: "Courier New", Courier, monospace;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* Шапка */
  header {
    margin-bottom: 28px;
    border-bottom: 1px dashed #cccccc;
    padding-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #111111;
  }
  .slogan {
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 6px;
    color: #666666;
  }
  .meta {
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 12px;
    color: #888888;
  }

  /* Сообщения — каждое своего цвета */
  .msg {
    padding: 12px 16px;
    margin-bottom: 14px;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
    word-break: break-word;
    line-height: 1.5;
    font-size: 14px;
    color: #111111;
  }
  .msg .when {
    float: right;
    font-size: 11px;
    color: #555555;
    letter-spacing: 1px;
  }

  /* Ник — и обычный текст, и ссылка */
  .msg .who,
  .msg a.who {
    display: block;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: var(--accent);
    text-decoration: none;
    width: fit-content;
  }
  .msg a.who:hover {
    text-decoration: underline;
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: #999999;
    letter-spacing: 1px;
  }

  #status {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #999999;
    background: #ffffff;
    padding: 4px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Msg Wall</h1>
      <div class="slogan">// напиши — и оно останется</div>
      <div class="meta" id="meta">> загрузка…</div>
    </header>

    <div id="messages"></div>
  </div>

  <div id="status"></div>

<script>
const FILE = "messages.jsonl";
const REFRESH_MS = 15000;

// Палитра: 12 цветов. accent — цвет текста/ссылки, bg — очень светлый фон карточки
const PALETTE = [
  { accent: "#c0392b", bg: "#fdecea" }, // красный
  { accent: "#d35400", bg: "#fdf1e7" }, // оранжевый
  { accent: "#b7950b", bg: "#fcf6e0" }, // тёмно-жёлтый
  { accent: "#7d6608", bg: "#f7f4e1" }, // оливковый
  { accent: "#1e8449", bg: "#e8f6ee" }, // зелёный
  { accent: "#0e6655", bg: "#e4f3f0" }, // тёмно-бирюзовый
  { accent: "#1a5276", bg: "#e7f0f7" }, // синий
  { accent: "#2874a6", bg: "#eaf2fa" }, // голубой
  { accent: "#5b2c6f", bg: "#f0e8f4" }, // фиолетовый
  { accent: "#884ea0", bg: "#f4ecf7" }, // сиреневый
  { accent: "#a93226", bg: "#fbe9e7" }, // тёмно-красный
  { accent: "#212f3c", bg: "#eceff1" }, // тёмно-серый
];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function renderAuthor(m) {
  const name = m.who || "?";
  const u = m.username || (name.startsWith("@") ? name.slice(1) : "");
  if (u) {
    return `<a class="who" href="https://t.me/${encodeURIComponent(u)}"
              target="_blank" rel="noopener noreferrer">@${escapeHtml(u)}</a>`;
  }
  return `<span class="who">${escapeHtml(name)}</span>`;
}

function render(lines) {
  const box = document.getElementById("messages");
  const meta = document.getElementById("meta");

  const items = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    try { items.push(JSON.parse(t)); }
    catch { items.push({ text: t, who: "?", when: "" }); }
  }

  if (items.length === 0) {
    box.innerHTML = '<div class="empty">> пока сообщений нет_</div>';
    meta.textContent = "> всего сообщений: 0";
    return;
  }

  meta.textContent = "> всего сообщений: " + items.length;

  box.innerHTML = items
    .slice()
    .reverse()
    .map((m, i) => {
      const color = PALETTE[i % PALETTE.length];
      return `
        <div class="msg" style="--accent:${color.accent}; --bg:${color.bg};">
          <span class="when">${escapeHtml(m.when || "")}</span>
          ${renderAuthor(m)}
          ${escapeHtml(m.text || "")}
        </div>
      `;
    })
    .join("");
}

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    render(text.split("\n"));
    status.textContent = "// обновлено: " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "// ошибка загрузки: " + e.message;
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
