<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Msg Wall</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #0a0a0a;
    color: #ffffff;
    font-family: "Courier New", Courier, monospace;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    position: relative;
    z-index: 2;
  }

  /* ============ CRT-эффекты ============ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0px,
      rgba(255, 255, 255, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px,
      rgba(0, 0, 0, 0.35) 4px
    );
    mix-blend-mode: multiply;
  }

  body::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    height: 100px;
    top: -120px;
    pointer-events: none;
    z-index: 101;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.045) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: scan 8s linear infinite;
  }

  @keyframes scan {
    0%   { top: -120px; }
    100% { top: 100vh; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0) 55%,
      rgba(0, 0, 0, 0.55) 100%
    );
  }

  .wrap { animation: flicker 7s infinite; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: 0.94; }
    94%      { opacity: 1; }
    96%      { opacity: 0.97; }
    97%      { opacity: 1; }
  }

  /* ============ Шапка — всё по центру ============ */
  header {
    margin-bottom: 32px;
    border-bottom: 1px dashed #333333;
    padding-bottom: 20px;
    text-align: center;
  }

  h1 {
    font-size: 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
    text-align: center;
  }

  /* Слоган — как приглашение терминала */
  .slogan {
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: 10px;
    color: #999999;
    min-height: 20px;
    text-align: center;
  }
  .slogan .prompt { color: #51cf66; margin-right: 6px; }
  .slogan .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: #999999;
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.7s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .meta {
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 12px;
    color: #777777;
    text-align: center;
  }

  /* ============ Сообщения ============ */
  .msg {
    padding: 12px 16px;
    margin-bottom: 14px;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
    word-break: break-word;
    line-height: 1.5;
    font-size: 14px;
    color: #ffffff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 10px rgba(0, 0, 0, 0.6) inset;
  }
  .msg .when {
    float: right;
    font-size: 11px;
    color: #bbbbbb;
    letter-spacing: 1px;
  }

  .msg .who,
  .msg a.who {
    display: block;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: var(--accent);
    text-decoration: none;
    width: fit-content;
    text-shadow: 0 0 6px var(--accent);
    cursor: pointer;
  }
  .msg a.who:hover {
    text-decoration: underline;
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: #666666;
    letter-spacing: 1px;
  }

  #status {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #777777;
    background: rgba(10, 10, 10, 0.8);
    padding: 6px 0;
    z-index: 102;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Msg Wall</h1>
      <div class="slogan" id="slogan"></div>
      <div class="meta" id="meta">> загрузка…</div>
    </header>

    <div id="messages"></div>
  </div>

  <div class="vignette"></div>
  <div id="status"></div>

<script>
const FILE = "messages.jsonl";
const REFRESH_MS = 15000;
const SLOGAN_TEXT = "напиши — и оно останется";

const PALETTE = [
  { accent: "#ff6b6b", bg: "#2a1414" },
  { accent: "#ffa94d", bg: "#2a1e10" },
  { accent: "#ffd43b", bg: "#2a2410" },
  { accent: "#a9e34b", bg: "#1e2a10" },
  { accent: "#51cf66", bg: "#122a17" },
  { accent: "#38d9a9", bg: "#0f2a24" },
  { accent: "#4dabf7", bg: "#102030" },
  { accent: "#748ffc", bg: "#141a30" },
  { accent: "#b197fc", bg: "#1e1830" },
  { accent: "#da77f2", bg: "#271430" },
  { accent: "#f783ac", bg: "#2a1420" },
  { accent: "#ced4da", bg: "#1c1f22" },
];

function hashIndex(str, mod) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h) % mod;
}
function colorFor(m) {
  const key = (m.username || m.who || m.id || "unknown").toString().toLowerCase();
  return PALETTE[hashIndex(key, PALETTE.length)];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function extractUsername(m) {
  if (m.username) return m.username.replace(/^@/, "");
  const w = m.who || "";
  if (w.startsWith("@")) return w.slice(1);
  return "";
}

function renderAuthor(m) {
  const name = m.who || "?";
  const u = extractUsername(m);
  if (u) {
    return `<a class="who" href="https://t.me/${encodeURIComponent(u)}"
              target="_blank" rel="noopener noreferrer">@${escapeHtml(u)}</a>`;
  }
  return `<span class="who">${escapeHtml(name)}</span>`;
}

function render(lines) {
  const box = document.getElementById("messages");
  const meta = document.getElementById("meta");

  const items = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    try { items.push(JSON.parse(t)); }
    catch { items.push({ text: t, who: "?", when: "" }); }
  }

  if (items.length === 0) {
    box.innerHTML = '<div class="empty">> пока сообщений нет_</div>';
    meta.textContent = "> всего сообщений: 0";
    return;
  }

  meta.textContent = "> всего сообщений: " + items.length;

  box.innerHTML = items
    .slice()
    .reverse()
    .map(m => {
      const c = colorFor(m);
      return `
        <div class="msg" style="--accent:${c.accent}; --bg:${c.bg};">
          <span class="when">${escapeHtml(m.when || "")}</span>
          ${renderAuthor(m)}
          ${escapeHtml(m.text || "")}
        </div>
      `;
    })
    .join("");
}

// ============ Печать слогана как в терминале ============
async function sloganLoop() {
  const el = document.getElementById("slogan");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => Math.random() * (b - a) + a;

  const PROMPT = '<span class="prompt">&gt;</span> ';
  const CURSOR = '<span class="cursor"></span>';

  while (true) {
    // Печатаем с приглашением ">" в начале
    let typed = "";
    el.innerHTML = PROMPT + typed + CURSOR;
    for (let i = 0; i < SLOGAN_TEXT.length; i++) {
      typed += SLOGAN_TEXT[i];
      el.innerHTML = PROMPT + typed + CURSOR;
      await sleep(rand(30, 70));
    }

    // Пауза — мигает курсор на полной строке
    await sleep(2200);

    // Стираем (приглашение ">" остаётся до конца)
    for (let i = typed.length; i > 0; i--) {
      el.innerHTML = PROMPT + typed.slice(0, i - 1) + CURSOR;
      await sleep(rand(15, 35));
    }

    // Пустая пауза
    await sleep(700);
  }
}

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    render(text.split("\n"));
    status.textContent = "// обновлено: " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "// ошибка загрузки: " + e.message;
  }
}

sloganLoop();
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
