<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Msg Wall</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #0a0a0a;
    color: #ffffff;
    font-family: "Courier New", Courier, monospace;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    position: relative;
    z-index: 2;
    animation: flicker 7s infinite;
  }

  /* ============ CRT-эффекты ============ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0px,
      rgba(255, 255, 255, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px,
      rgba(0, 0, 0, 0.35) 4px
    );
    mix-blend-mode: multiply;
  }

  body::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    height: 100px;
    top: -120px;
    pointer-events: none;
    z-index: 101;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.045) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: scan 8s linear infinite;
  }

  @keyframes scan {
    0%   { top: -120px; }
    100% { top: 100vh; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0) 55%,
      rgba(0, 0, 0, 0.55) 100%
    );
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: 0.94; }
    94%      { opacity: 1; }
    96%      { opacity: 0.97; }
    97%      { opacity: 1; }
  }

  /* ============ Шапка ============ */
  header {
    margin-bottom: 28px;
    border-bottom: 1px dashed #333333;
    padding-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
  }
  .live {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
    padding: 2px 8px;
    margin-left: 10px;
    vertical-align: middle;
    border-radius: 2px;
    text-shadow: 0 0 6px rgba(255, 77, 77, 0.8);
    animation: livePulse 1.4s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .slogan {
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 6px;
    color: #999999;
  }
  .meta {
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 12px;
    color: #777777;
  }

  /* ============ Сообщения ============ */
  .msg {
    padding: 12px 16px;
    margin-bottom: 14px;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
    word-break: break-word;
    line-height: 1.5;
    font-size: 14px;
    color: #ffffff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 10px rgba(0, 0, 0, 0.6) inset;
    opacity: 0;
    transform: translateY(8px);
  }
  /* Появление */
  .msg.show {
    animation: msgIn 0.35s ease-out forwards;
  }
  @keyframes msgIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .when {
    float: right;
    font-size: 11px;
    color: #bbbbbb;
    letter-spacing: 1px;
  }

  .msg .who,
  .msg a.who {
    display: block;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: var(--accent);
    text-decoration: none;
    width: fit-content;
    text-shadow: 0 0 6px var(--accent);
  }
  .msg a.who:hover {
    text-decoration: underline;
  }

  /* Текст сообщения — печатается */
  .msg .text {
    display: inline;
  }
  /* Курсор-палочка в конце, пока идёт печать */
  .msg .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.7s steps(1) infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: #666666;
    letter-spacing: 1px;
  }

  #status {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #777777;
    background: rgba(10, 10, 10, 0.8);
    padding: 6px 0;
    z-index: 102;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Msg Wall<span class="live">● LIVE</span></h1>
      <div class="slogan">// напиши — и оно останется</div>
      <div class="meta" id="meta">> загрузка…</div>
    </header>

    <div id="messages"></div>
  </div>

  <div class="vignette"></div>
  <div id="status"></div>

<script>
const FILE = "messages.jsonl";
const REFRESH_MS = 15000;

// Параметры эффекта печати
const CHAR_DELAY_MIN = 25;   // мс между буквами (мин)
const CHAR_DELAY_MAX = 60;   // мс между буквами (макс)
const MSG_DELAY_MIN  = 300;  // мс между сообщениями (мин)
const MSG_DELAY_MAX  = 900;  // мс между сообщениями (макс)

const PALETTE = [
  { accent: "#ff6b6b", bg: "#2a1414" },
  { accent: "#ffa94d", bg: "#2a1e10" },
  { accent: "#ffd43b", bg: "#2a2410" },
  { accent: "#a9e34b", bg: "#1e2a10" },
  { accent: "#51cf66", bg: "#122a17" },
  { accent: "#38d9a9", bg: "#0f2a24" },
  { accent: "#4dabf7", bg: "#102030" },
  { accent: "#748ffc", bg: "#141a30" },
  { accent: "#b197fc", bg: "#1e1830" },
  { accent: "#da77f2", bg: "#271430" },
  { accent: "#f783ac", bg: "#2a1420" },
  { accent: "#ced4da", bg: "#1c1f22" },
];

function hashIndex(str, mod) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h) % mod;
}
function colorFor(m) {
  const key = (m.username || m.who || m.id || "unknown").toString().toLowerCase();
  return PALETTE[hashIndex(key, PALETTE.length)];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function rand(min, max) { return Math.random() * (max - min) + min; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function authorHTML(m) {
  const name = m.who || "?";
  const u = m.username || (name.startsWith("@") ? name.slice(1) : "");
  if (u) {
    return `<a class="who" href="https://t.me/${encodeURIComponent(u)}"
              target="_blank" rel="noopener noreferrer">@${escapeHtml(u)}</a>`;
  }
  return `<span class="who">${escapeHtml(name)}</span>`;
}

// Печатаем букву за буквой в .text внутри карточки
async function typeText(node, text, accent) {
  for (let i = 0; i < text.length; i++) {
    node.textContent += text[i];
    // случайная задержка между символами
    await sleep(rand(CHAR_DELAY_MIN, CHAR_DELAY_MAX));
  }
}

// Печатаем все сообщения по очереди (снизу вверх, как «прямой эфир»)
async function playLive(items, container) {
  // Идём от старых к новым — как будто только что писали в прямом эфире
  for (let i = 0; i < items.length; i++) {
    const m = items[i];
    const c = colorFor(m);

    // Создаём карточку
    const div = document.createElement("div");
    div.className = "msg";
    div.style.setProperty("--accent", c.accent);
    div.style.setProperty("--bg", c.bg);

    // Дата
    const when = document.createElement("span");
    when.className = "when";
    when.textContent = m.when || "";
    div.appendChild(when);

    // Автор
    const authorWrap = document.createElement("span");
    authorWrap.innerHTML = authorHTML(m);
    div.appendChild(authorWrap);

    // Текст + курсор
    const textWrap = document.createElement("span");
    textWrap.className = "text";
    const cursor = document.createElement("span");
    cursor.className = "cursor";

    const line = document.createElement("div");
    line.appendChild(textWrap);
    line.appendChild(cursor);
    div.appendChild(line);

    // Вставляем карточку СВЕРХУ списка (новые сверху)
    container.insertBefore(div, container.firstChild);

    // Плавно показать
    requestAnimationFrame(() => div.classList.add("show"));

    // Печатаем текст
    await typeText(textWrap, m.text || "", c.accent);

    // Убираем курсор
    cursor.remove();

    // Пауза перед следующим
    await sleep(rand(MSG_DELAY_MIN, MSG_DELAY_MAX));
  }
}

let isRendering = false;
let lastCount = -1;

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    const items = [];
    for (const line of text.split("\n")) {
      const t = line.trim();
      if (!t) continue;
      try { items.push(JSON.parse(t)); }
      catch { items.push({ text: t, who: "?", when: "" }); }
    }

    const meta = document.getElementById("meta");
    meta.textContent = "> всего сообщений: " + items.length;

    const box = document.getElementById("messages");

    if (items.length === 0) {
      box.innerHTML = '<div class="empty">> пока сообщений нет_</div>';
      lastCount = 0;
      return;
    }

    // Если количество не изменилось — ничего не делаем (не перезапускаем печать)
    if (items.length === lastCount) {
      status.textContent = "// обновлено: " + new Date().toLocaleTimeString();
      return;
    }

    // Если уже что-то печатается — не мешаем
    if (isRendering) return;

    // При первом запуске печатаем ВСЕ сообщения по очереди
    if (lastCount < 0) {
      isRendering = true;
      box.innerHTML = "";
      await playLive(items, box);
      isRendering = false;
    } else {
      // Появились новые — печатаем только их (с конца, т.е. новые сверху)
      const fresh = items.slice(lastCount);
      isRendering = true;
      await playLive(fresh, box);
      isRendering = false;
    }

    lastCount = items.length;
    status.textContent = "// обновлено: " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "// ошибка загрузки: " + e.message;
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
