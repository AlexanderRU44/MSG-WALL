<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Msg Wall</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #0a0a0a;
    color: #d0d0d0;
    font-family: "Courier New", Courier, monospace;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    position: relative;
    z-index: 2;
  }

  /* ============ CRT effects ============ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0px,
      rgba(255, 255, 255, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px,
      rgba(0, 0, 0, 0.35) 4px
    );
    mix-blend-mode: multiply;
  }
  body::after {
    content: "";
    position: fixed;
    left: 0; right: 0;
    height: 100px; top: -120px;
    pointer-events: none;
    z-index: 101;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.045) 50%,
      rgba(255,255,255,0) 100%
    );
    animation: scan 8s linear infinite;
  }
  @keyframes scan { 0% { top: -120px; } 100% { top: 100vh; } }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background: radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 55%,
      rgba(0,0,0,0.55) 100%
    );
  }

  .wrap { animation: flicker 7s infinite; }
  @keyframes flicker {
    0%,100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.94; }
    94% { opacity: 1; }
    96% { opacity: 0.97; }
    97% { opacity: 1; }
  }

  header { margin-bottom: 24px; text-align: center; }

  h1 {
    font-size: 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 6px rgba(255,255,255,0.25);
  }

  .slogan, .meta {
    font-size: 14px;
    letter-spacing: 1px;
    color: #999999;
    min-height: 20px;
    text-align: center;
  }
  .slogan { margin-top: 10px; }
  .meta   { margin-top: 6px; font-size: 13px; color: #888888; }

  .prompt { color: inherit; margin-right: 6px; }

  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: currentColor;
    margin-left: 2px; vertical-align: -2px;
    animation: blink 0.7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tline {
    word-break: break-word;
    white-space: pre-wrap;
  }
  .tline .dim { color: #666666; }
  .tline .err { color: #ff6b6b; }
  .tline .ok  { color: #51cf66; }

  #loading {
    text-align: center;
    padding: 40px 0;
    color: #888888;
    min-height: 60px;
  }
  #loading.hidden { display: none; }
  #loading .center-line { display: inline-block; }

  #gate { display: none; padding: 24px 0 12px; }
  #gate.visible { display: block; }

  #gate .hint {
    color: #888888;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 18px;
    text-align: center;
  }

  #gate .digits {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
  }

  #gate .digit {
    width: 46px; height: 60px;
    border: 1px solid #333333;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #ffffff;
    background: #141414;
    text-shadow: 0 0 6px rgba(255,255,255,0.35);
  }
  #gate .digit.active {
    border-color: #666666;
    animation: blink 1s steps(1) infinite;
  }

  #gate .keypad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    gap: 10px;
    justify-content: center;
  }
  #gate .keypad button {
    width: 64px; height: 60px;
    background: transparent;
    border: 1px solid #333333;
    border-radius: 4px;
    color: #ffffff;
    font-family: inherit;
    font-size: 22px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.15s, border-color 0.15s;
  }
  #gate .keypad button:hover {
    border-color: #666666;
    background: rgba(255,255,255,0.03);
  }
  #gate .keypad .action {
    font-size: 12px; letter-spacing: 1px; color: #999999;
  }

  #messages { margin-top: 8px; }

  .msg {
    padding: 6px 0 6px 14px;
    border-left: 3px solid var(--accent);
    margin-bottom: 10px;
    word-break: break-word;
    line-height: 1.5;
    font-size: 14px;
    color: #ffffff;
  }
  .msg .when {
    color: #666666;
    font-size: 12px;
    margin-right: 8px;
  }
  .msg .who {
    font-weight: bold;
    color: var(--accent);
    text-decoration: none;
    text-shadow: 0 0 6px var(--accent);
  }
  .msg .who:hover { text-decoration: underline; }
  .msg .text {
    color: #d0d0d0;
    margin-left: 6px;
  }

  /* Стили для системных сообщений (смена ника) */
  .msg.system {
    border-left-color: #555555;
    background: rgba(255,255,255,0.02);
    color: #888888;
    font-style: italic;
  }
  .msg.system .text { color: #888888; }

  #input-area {
    display: none;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px dashed #333333;
  }
  #input-area.visible { display: block; }

  #input-area .row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #input-area .input-prompt {
    color: #888888;
    user-select: none;
  }

  #input-area input {
    flex: 1;
    min-width: 200px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333333;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    padding: 6px 2px;
    outline: none;
  }
  #input-area input:focus { border-bottom-color: #666666; }

  #input-area button {
    background: transparent;
    border: 1px solid #333333;
    color: #999999;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: color 0.2s, border-color 0.2s;
  }
  #input-area button:hover {
    color: #ffffff;
    border-color: #666666;
  }
  #input-area button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #input-area .status {
    color: #666666;
    font-size: 12px;
    margin-top: 10px;
    min-height: 32px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  #input-area .status.ok  { color: #51cf66; }
  #input-area .status.err { color: #ff6b6b; }

  #status {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #777777;
    background: rgba(10,10,10,0.8);
    padding: 6px 0;
    z-index: 102;
  }

  @media (max-width: 480px) {
    #gate .digit { width: 40px; height: 54px; font-size: 26px; }
    #gate .keypad { grid-template-columns: repeat(3, 58px); }
    #gate .keypad button { width: 58px; height: 56px; font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Msg Wall</h1>
      <div class="slogan" id="slogan"></div>
      <div class="meta" id="meta"></div>
    </header>

    <div id="loading"></div>

    <div id="gate">
      <div class="hint">enter today's code</div>
      <div class="digits" id="digits">
        <div class="digit active"></div>
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
      </div>
      <div class="keypad" id="keypad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="action" data-key="clear">CLR</button>
        <button data-key="0">0</button>
        <button class="action" data-key="back">←</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <div class="row">
        <span class="input-prompt">&gt;</span>
        <input id="msg-input" type="text" maxlength="500" placeholder="type a message or /help…" autocomplete="off" />
        <button id="send-btn">SEND</button>
      </div>
      <div class="status" id="input-status"></div>
    </div>
  </div>

  <div class="vignette"></div>
  <div id="status"></div>

<script>
const API = "https://msg-wall.onrender.com";
const REFRESH_MS = 5000;
const SLOGAN_TEXT = "write it — and it stays";

const PALETTE = [
  { accent: "#ff6b6b" },
  { accent: "#ffa94d" },
  { accent: "#ffd43b" },
  { accent: "#a9e34b" },
  { accent: "#51cf66" },
  { accent: "#38d9a9" },
  { accent: "#4dabf7" },
  { accent: "#748ffc" },
  { accent: "#b197fc" },
  { accent: "#da77f2" },
  { accent: "#f783ac" },
  { accent: "#ced4da" },
];

function hashIndex(str, mod) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h) % mod;
}
function colorForHash(h) {
  return PALETTE[hashIndex(String(h).toLowerCase(), PALETTE.length)];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function formatLocalFromUTC(whenStr) {
  if (!whenStr) return "";
  const iso = whenStr.replace(" ", "T") + "Z";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return whenStr;
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function nowLocalString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ============ Typing ============
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.random() * (b - a) + a;

const PROMPT_HTML = '<span class="prompt">&gt;</span> ';
const CURSOR_HTML = '<span class="cursor"></span>';

async function typeInto(el, text, charMin, charMax) {
  let typed = "";
  el.innerHTML = PROMPT_HTML + typed + CURSOR_HTML;
  for (let i = 0; i < text.length; i++) {
    typed += text[i];
    el.innerHTML = PROMPT_HTML + typed + CURSOR_HTML;
    await sleep(rand(charMin, charMax));
  }
  el.innerHTML = PROMPT_HTML + typed;
}

async function typeCentered(el, text, charMin, charMax) {
  el.innerHTML = '<span class="center-line"></span>';
  const line = el.querySelector(".center-line");
  let typed = "";
  line.innerHTML = typed + CURSOR_HTML;
  for (let i = 0; i < text.length; i++) {
    typed += text[i];
    line.innerHTML = typed + CURSOR_HTML;
    await sleep(rand(charMin, charMax));
  }
  line.innerHTML = typed;
}

// ============ State ============
let codeValue = "";
let unlocked = false;
let sessionCode = null;
let myHash = null;
let myNick = null;
let nicksMap = {};
let renderedCount = -1;
let allItems = [];

// ============ DOM ============
const sloganEl  = document.getElementById("slogan");
const metaEl    = document.getElementById("meta");
const loadingEl = document.getElementById("loading");
const gateEl    = document.getElementById("gate");
const messagesEl= document.getElementById("messages");
const digitsEl  = document.getElementById("digits");
const keypadEl  = document.getElementById("keypad");
const inputArea = document.getElementById("input-area");
const msgInput  = document.getElementById("msg-input");
const sendBtn   = document.getElementById("send-btn");
const inputStatus = document.getElementById("input-status");

// ============ Fetch from Render ============
async function fetchMessages() {
  const res = await fetch(API + "/messages?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("messages HTTP " + res.status);
  const data = await res.json();
  return data.messages || [];
}

async function fetchNicks() {
  const res = await fetch(API + "/nicks?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("nicks HTTP " + res.status);
  const data = await res.json();
  return data.nicks || {};
}

// ============ API POST ============
async function apiPost(path, payload) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) return { ok: false, reason: "http" };
  try { return await res.json(); }
  catch { return { ok: false, reason: "parse" }; }
}

// ============ Render ============
function authorLabelFor(msg) {
  // Если это системное сообщение, возвращаем null (ник не нужен)
  if (msg.system) return null;
  
  const n = nicksMap[msg.ip_hash];
  if (n) return { text: "@" + n };
  return { text: "@" + msg.ip_hash };
}

function buildMessagesHTML(items) {
  return items
    .slice()
    .reverse()
    .map(m => {
      if (m.system) {
        // Системное сообщение
        return `
          <div class="msg system">
            <span class="when">${escapeHtml(formatLocalFromUTC(m.when || ""))}</span>
            <span class="text">${escapeHtml(m.text || "")}</span>
          </div>
        `;
      }

      // Обычное сообщение
      const c = colorForHash(m.ip_hash);
      const a = authorLabelFor(m);
      const when = formatLocalFromUTC(m.when || "");
      return `
        <div class="msg" style="--accent:${c.accent};">
          <span class="when">${escapeHtml(when)}</span>
          <span class="who">${escapeHtml(a.text)}</span>
          <span class="text">${escapeHtml(m.text || "")}</span>
        </div>
      `;
    })
    .join("");
}

function renderMessages(items) {
  if (items.length === 0) {
    messagesEl.innerHTML = '<div class="tline"><span class="dim">&gt; no messages yet_</span></div>';
  } else {
    messagesEl.innerHTML = buildMessagesHTML(items);
  }
  renderedCount = items.length;
}

// ============ Bootstrap ============
let bootstrapped = false;
async function bootstrap() {
  if (bootstrapped) return;
  bootstrapped = true;

  await typeInto(sloganEl, SLOGAN_TEXT, 30, 70);
  await sleep(300);

  try {
    allItems = await fetchMessages();
    nicksMap = await fetchNicks();
  } catch (e) {
    allItems = []; nicksMap = {};
  }

  await typeInto(metaEl, "total messages: " + allItems.length, 25, 50);

  gateEl.classList.add("visible");
  updateDigitsUI();
}

// ============ Code gate ============
function updateDigitsUI() {
  const cells = digitsEl.querySelectorAll(".digit");
  cells.forEach((cell, i) => {
    if (i < codeValue.length) {
      cell.textContent = codeValue[i];
      cell.classList.remove("active");
    } else {
      cell.textContent = "";
      cell.classList.toggle("active", i === codeValue.length);
    }
  });
}

async function submitCode() {
  if (codeValue.length < 4) return;

  const code = codeValue;
  const res = await apiPost("/verify", { code });

  if (!res.ok) {
    codeValue = "";
    updateDigitsUI();
    return;
  }

  unlocked = true;
  sessionCode = code;
  myHash = res.hash;
  myNick = res.nick;

  codeValue = "";
  updateDigitsUI();
  gateEl.classList.remove("visible");

  loadingEl.textContent = "";
  loadingEl.classList.remove("hidden");
  await typeCentered(loadingEl, "loading…", 40, 90);
  await sleep(400);
  loadingEl.classList.add("hidden");

  try {
    allItems = await fetchMessages();
    nicksMap = await fetchNicks();
  } catch (e) { /* ignore */ }

  renderMessages(allItems);
  inputArea.classList.add("visible");
  msgInput.focus();
}

keypadEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-key]");
  if (!btn) return;
  const key = btn.dataset.key;

  if (key === "clear") { codeValue = ""; updateDigitsUI(); return; }
  if (key === "back")  { codeValue = codeValue.slice(0, -1); updateDigitsUI(); return; }

  if (codeValue.length >= 4) return;
  codeValue += key;
  updateDigitsUI();
  if (codeValue.length === 4) setTimeout(submitCode, 200);
});

document.addEventListener("keydown", e => {
  if (!gateEl.classList.contains("visible")) {
    if (e.key === "Enter" && document.activeElement === msgInput) sendMessage();
    return;
  }
  if (e.key >= "0" && e.key <= "9") {
    if (codeValue.length < 4) {
      codeValue += e.key; updateDigitsUI();
      if (codeValue.length === 4) setTimeout(submitCode, 200);
    }
  } else if (e.key === "Backspace") {
    codeValue = codeValue.slice(0, -1); updateDigitsUI();
  } else if (e.key === "Escape") {
    codeValue = ""; updateDigitsUI();
  }
});

// ============ Send ============
function setStatus(text, cls = "") {
  inputStatus.textContent = text;
  inputStatus.className = "status" + (cls ? " " + cls : "");
}

async function sendMessage() {
  const rawText = msgInput.value.trim();
  if (!rawText || !sessionCode) return;

  // === Обработка локальных команд ===
  if (rawText.startsWith("/")) {
    const parts = rawText.split(" ");
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(" ").trim();

    // /help или /commands
    if (cmd === "/help" || cmd === "/commands") {
      setStatus("Available commands:\n/nick <name> — change your nick\n/help — show this list", "ok");
      msgInput.value = "";
      return;
    }

    // /nick <name>
    if (cmd === "/nick" || cmd === "/name") {
      if (!arg) {
        setStatus("error: usage /nick <name>", "err");
        msgInput.value = "";
        return;
      }

      setStatus("> changing nick…");
      const res = await apiPost("/nick", { code: sessionCode, nick: arg });

      if (!res.ok) {
        const reasons = {
          short: "nick must be 2–20 characters",
          long: "nick must be 2–20 characters",
          space: "no spaces allowed",
          chars: "only letters, digits, _ and -",
          reserved: "this nick is reserved",
          taken: "this nick is already taken, try another",
          cooldown: `wait ${res.wait || 0}s before changing again`,
          github: "storage error",
          code: "code expired, reload page",
          http: "server error"
        };
        setStatus("error: " + (reasons[res.reason] || res.reason), "err");
        return;
      }

      // Успешно сменили ник
      const oldNickLabel = myNick ? "@" + myNick : "@" + myHash;
      myNick = res.nick;
      
      setStatus(`> success: your nick is now @${res.nick}`, "ok");
      msgInput.value = "";

      // Обновляем данные с сервера (там уже есть системное сообщение)
      try {
        nicksMap = await fetchNicks();
        allItems = await fetchMessages();
        renderMessages(allItems);
        metaEl.innerHTML = PROMPT_HTML + "total messages: " + allItems.length;
      } catch (e) { /* ignore */ }

      setTimeout(() => { setStatus(""); }, 4000);
      return;
    }

    // Неизвестная команда
    setStatus("error: unknown command. type /help", "err");
    msgInput.value = "";
    return;
  }

  // === Обычное сообщение ===
  sendBtn.disabled = true;
  setStatus("> sending…");

  const res = await apiPost("/post", { code: sessionCode, text: rawText });

  sendBtn.disabled = false;

  if (!res.ok) {
    const reasons = {
      code: "code expired, reload page",
      empty: "message is empty",
      github: "storage error",
      http: "server error"
    };
    setStatus("> error: " + (reasons[res.reason] || res.reason), "err");
    return;
  }

  msgInput.value = "";
  setStatus("> sent", "ok");

  // Мгновенно обновляем из Render
  try {
    allItems = await fetchMessages();
    nicksMap = await fetchNicks();
    renderMessages(allItems);
    metaEl.innerHTML = PROMPT_HTML + "total messages: " + allItems.length;
  } catch (e) { /* ignore */ }

  setTimeout(() => { setStatus(""); }, 2000);
}

sendBtn.addEventListener("click", sendMessage);

// ============ Periodic refresh ============
async function refresh() {
  if (!unlocked) return;
  try {
    const items = await fetchMessages();
    if (items.length !== renderedCount) {
      allItems = items;
      nicksMap = await fetchNicks();
      renderMessages(allItems);
      metaEl.innerHTML = PROMPT_HTML + "total messages: " + allItems.length;
    }
    document.getElementById("status").textContent = "// updated: " + nowLocalString();
  } catch (e) {
    document.getElementById("status").textContent = "// load error: " + e.message;
  }
}

bootstrap();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
