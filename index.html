<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Msg Wall</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  
  <div class="app-container" id="app-container">
    <header>
      <h1>Msg Wall</h1>
      <div class="slogan" id="slogan"></div>
      <div class="meta" id="meta"></div>
    </header>

    <div id="loading"></div>

    <div id="gate">
      <div class="hint" id="gate-hint">enter today's code</div>
      
      <!-- Скрытое поле (для обычного ввода) -->
      <textarea id="hidden-input" style="position: absolute; opacity: 0; top: 0; left: 0; width: 100%; height: 100%; cursor: text; z-index: 10;"></textarea>

      <!-- Обычный ввод (4 цифры) -->
      <div class="digits" id="digits" style="position: relative;">
        <div class="digit active"></div>
        <div class="digit"></div>
        <div class="digit"></div>
        <div class="digit"></div>
      </div>

      <!-- Админ-ввод (появится, если ?admin) -->
      <div id="admin-input-area" style="display: none; margin-top: 20px; text-align: center;">
        <input type="password" id="admin-code-input" placeholder="enter admin code" style="width: 80%; max-width: 300px; background: #141414; border: 1px solid #333; color: #fff; padding: 12px; text-align: center; font-family: 'Courier New', monospace; font-size: 16px; outline: none; border-radius: 4px;">
      </div>

      <div class="keypad" id="keypad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="action" data-key="clear">CLR</button>
        <button data-key="0">0</button>
        <button class="action" data-key="back">←</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <div class="input-row">
        <span class="input-prompt">&gt;</span>
        <input id="msg-input" type="text" maxlength="500" placeholder="type a message, @nick or /command…" autocomplete="off" />
        <button id="send-btn">SEND</button>
      </div>
      <div id="dropdown-menu"></div>
    </div>
  </div>

  <div class="vignette"></div>
  <div id="status"></div>

  <script src="js/script.js"></script>
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error:", err));
      });
    }
  </script>
</body>
</html>
